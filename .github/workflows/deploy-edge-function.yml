name: Deploy Supabase Edge Function

# main    → боевой проект (живой сайт)
# staging → тестовый проект; сайт этой ветки Cloudflare собирает на staging-ovora-cargo.saburov.workers.dev
on:
  workflow_dispatch:
  push:
    branches: [main, staging]
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Edge Function
        run: |
          supabase functions deploy make-server-4e36197a --project-ref "$PROJECT_REF"
        env:
          # У каждого проекта свой токен: SUPABASE_ACCESS_TOKEN1 — боевой, SUPABASE_ACCESS_TOKEN — тестовый.
          SUPABASE_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_ACCESS_TOKEN1 || secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ github.ref == 'refs/heads/main' && 'mkbcjxnoeevtkzaqcpsh' || 'xrtqquuwlnnihphszyns' }}
