name: Setup staging secrets

# Один клик: Actions → Setup staging secrets → Run workflow.
# Создаёт для ТЕСТОВОГО проекта новые случайные секреты. Значения нигде не выводятся.
# Боевые значения не копируются намеренно: общий ключ подписи дал бы тестовому входу доступ
# к боевым данным. Уже заданные секреты не трогаются — повторный запуск не выкинет тестовых
# пользователей.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: xrtqquuwlnnihphszyns
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set missing staging secrets
        run: |
          set -euo pipefail
          existing="$(supabase secrets list --project-ref "$PROJECT_REF" -o json | jq -r '.[].name')"
          env_file="$(mktemp)"
          add() { if ! grep -qx "$1" <<<"$existing"; then printf '%s=%s\n' "$1" "$2" >> "$env_file"; echo "будет задан: $1"; else echo "уже есть: $1"; fi; }
          add USER_JWT_SECRET  "$(openssl rand -hex 32)"
          add ADMIN_JWT_SECRET "$(openssl rand -hex 32)"
          add AVIA_JWT_SECRET  "$(openssl rand -hex 32)"
          add SITE_URL         "https://staging-ovora-cargo.saburov.workers.dev"
          # Вход без письма для сквозных тестов; на боевом проекте код его не включает (e2eLogin.tsx).
          add E2E_LOGIN_ENABLED "true"
          if [ -s "$env_file" ]; then
            supabase secrets set --project-ref "$PROJECT_REF" --env-file "$env_file" > /dev/null
          fi
          rm -f "$env_file"
          echo "Готово. ADMIN_ACCESS_CODE и TELEGRAM_BOT_TOKEN задаются вручную в кабинете Supabase."
